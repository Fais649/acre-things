:root{--ink:#0b0b0b;--sea:#5ce1ff;--paper:#fff9ed;--lime:#8cff5a;--pink:#ff7ad9}body{font-family:'Space Grotesk',system-ui;background:var(--paper);color:var(--ink)}#app{height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}h1{font-size:25px;margin:0;letter-spacing:-1px}p{margin:0;font-size:14px;line-height:1.4}.mono,button,select{font-family:'Space Mono',monospace}.mono{font-size:11px;text-transform:uppercase}header{display:flex;justify-content:space-between;align-items:center}button,select{font-size:12px;border:2px solid var(--ink);border-radius:8px;padding:10px;background:white;color:var(--ink);min-height:44px;box-shadow:2px 2px 0 var(--ink)}button:active{transform:translate(2px,2px);box-shadow:none}button:disabled{opacity:.45;box-shadow:none}.row{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--lime)}.danger{background:var(--pink)}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:100%;max-width:540px;align-self:center}.cell{min-height:0;aspect-ratio:1;border:1.5px solid var(--ink);padding:0;border-radius:4px;box-shadow:none;background:var(--sea);font-size:11px}.ship{background:var(--lime)}.hit{background:var(--pink)}.miss{background:white}.selected{outline:3px solid var(--ink);outline-offset:1px}.card{padding:12px;border:2px solid var(--ink);border-radius:10px;background:white}.status{background:var(--sea)}#error{color:#a52323;min-height:18px;font-size:12px}#confirm{background:var(--pink)}.legend{font-size:11px}.muted{opacity:.65}.fill{flex:1}select{max-width:100%}@media(min-width:500px){#app{padding:22px}.cell{font-size:14px}}@media(max-width:260px){#app{padding:8px;gap:6px}h1{font-size:18px}.grid{gap:1px}.cell{border-radius:2px}button{font-size:10px;padding:7px}}

<div id="app"><header><h1>BATTLESHIP</h1><button id="expand" aria-label="Open Battleship full screen">OPEN</button></header><p class="mono" id="opponent">YOUR HALF OF THE OCEAN</p><div class="card status" id="status" role="status">Loading your game...</div><div id="controls" class="row"></div><div id="boardTitle" class="mono"></div><div id="board" class="grid" role="group" aria-label="Battleship board"></div><div id="below" class="row"></div><p class="legend" id="legend"></p><p id="error" role="alert"></p><div class="fill"></div><div id="end" class="row"></div></div>
<script>
(function(){
'use strict';
var lengths=[5,4,3,3,2],fleet=[],vertical=false,selected=null,state=null,busy=false,tab='radar',friends=null,chosenFriend=null,confirmEnd=false,newGame=false;
var $=function(id){return document.getElementById(id)},preview=acre.mode==='preview';
function button(label,fn,kind,disabled){var b=document.createElement('button');b.textContent=label;b.className=kind||'';b.disabled=!!disabled||busy;b.onclick=fn;return b}
function message(e){$('error').textContent=e&&e.message||String(e)}
function sample(){state={status:'playing',opponent:'your friend',fleet:[[0,1,2,3,4],[20,21,22,23],[40,41,42],[60,61,62],[80,81]],shots:[{cell:13,hit:false},{cell:32,hit:true}],incoming:[{cell:0,hit:true},{cell:10,hit:false}],sunk:[],ready:true,opponentReady:true,myTurn:true};draw()}
async function request(action,data){if(busy)return;busy=true;$('error').textContent='';draw();try{state=await acre.game(action,data||{});if(action==='invite')newGame=false;selected=null;confirmEnd=false;draw()}catch(e){message(e)}finally{busy=false;draw()}}
function shuffle(){fleet=[];lengths.forEach(function(n){var placed=false;while(!placed){var start=Math.floor(Math.random()*100),v=Math.random()<.5,cells=Array.from({length:n},function(_,k){return start+k*(v?10:1)});if(cells.every(function(c){return c<100&&(v||Math.floor(c/10)===Math.floor(start/10))&&!fleet.flat().includes(c)})){fleet.push(cells);placed=true}}});draw()}
function place(cell){if(fleet.length===5)return;var n=lengths[fleet.length],cells=Array.from({length:n},function(_,k){return cell+k*(vertical?10:1)});if(cells.some(function(c){return c>=100||(!vertical&&Math.floor(c/10)!==Math.floor(cell/10))||fleet.flat().includes(c)})){message(new Error('That ship does not fit. Try another cell or rotate.'));return}fleet.push(cells);$('error').textContent='';draw()}
async function chooseFriend(){if(busy)return;busy=true;draw();try{friends=await acre.game('friends')}catch(e){message(e)}finally{busy=false;draw()}}
function draw(){
 $('expand').style.display=acre.expanded?'none':'';
 $('expand').onclick=function(){acre.expand().catch(message)};
 ['controls','board','below','end'].forEach(function(id){$(id).replaceChildren()});
 $('boardTitle').textContent='';$('legend').textContent='';
 if(!acre.me.isOwner&&!preview){$('status').textContent='This board belongs to @'+acre.owner.handle+'. Play from your own space.';return}
 if(preview&&!state){sample();return}
 var status=state&&state.status,setup=status==='setup'&&!state.ready,active=status==='playing',finished=status==='finished';
 $('opponent').textContent=state?'VS @'+state.opponent:'YOUR HALF OF THE OCEAN';
 if(!state||['declined','cancelled'].includes(status)){
  $('status').textContent=status==='declined'?'Your friend declined. Invite someone else.':status==='cancelled'?'Invitation cancelled. Ready for a new game?':'Two spaces. Two hidden fleets. Invite a friend to begin.';
  if(!friends)$('controls').append(button('INVITE A FRIEND',chooseFriend,'primary'));
  else if(!friends.length)$('status').textContent='Add a friend in Acre first, then invite them here.';
  else{var select=document.createElement('select');select.setAttribute('aria-label','Friend to invite');select.onchange=function(){chosenFriend=select.value};friends.forEach(function(f){var o=document.createElement('option');o.value=f.id;o.textContent='@'+f.handle;select.append(o)});if(chosenFriend&&friends.some(function(f){return f.id===chosenFriend}))select.value=chosenFriend;else chosenFriend=select.value;$('controls').append(select,button('SEND INVITATION',function(){request('invite',{friend:select.value})},'primary'))}
  return;
 }
